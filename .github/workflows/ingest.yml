name: Ingest data

# Weekly pull of CFBD data + ESPN FPI into data/<season>/, committed back to the repo.
# Needs a repository secret named CFBD_API_KEY.

on:
  schedule:
    # Mondays 12:17 UTC (8:17am EDT / 7:17am EST) — after Sunday's AP and Coaches polls.
    - cron: "17 12 * * 1"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks to (re)pull, e.g. 1-6 or 3,5. Blank = latest completed week."
        required: false
        default: ""
      season:
        description: "Season year. Blank = current season."
        required: false
        default: ""
      season_type:
        description: "regular or postseason (only used with weeks)"
        required: false
        default: "regular"
        type: choice
        options: [regular, postseason]
      skip_season_files:
        description: "Skip the season-to-date files (saves ~25 API calls)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          WEEKS: ${{ inputs.weeks }}
          SEASON: ${{ inputs.season }}
          SEASON_TYPE: ${{ inputs.season_type }}
          SKIP_SEASON: ${{ inputs.skip_season_files }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "::error::Add a repository secret named CFBD_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          args=()
          [ -n "$WEEKS" ] && args+=(--weeks "$WEEKS" --season-type "${SEASON_TYPE:-regular}")
          [ -n "$SEASON" ] && args+=(--season "$SEASON")
          [ "$SKIP_SEASON" = "true" ] && args+=(--no-season)
          node scripts/ingest.mjs "${args[@]}"

      # Commit whatever was fetched, even if some endpoints failed.
      - name: Commit data
        if: always()
        run: |
          git config user.name "snapcount-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Data: ingest ${{ inputs.weeks && format('weeks {0}', inputs.weeks) || 'weekly' }} ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash
          git push
